name: Package Demo

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          mkdir -p dist
          tar -czf dist/port-ocean-github-demo.tar.gz src tests docs README.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: port-ocean-github-demo
          path: dist/
